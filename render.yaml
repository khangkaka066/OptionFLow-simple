services:
  - type: web
    name: quant-research-live
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-options.txt
    startCommand: python scripts/live_server.py --host 0.0.0.0 --port $PORT --no-github-pull
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LIVE_API_CORS_ORIGIN
        value: "*"
