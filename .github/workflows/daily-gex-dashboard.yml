name: Daily QQQ GEX Dashboard

on:
  schedule:
    # 20:25 Vietnam time = 13:25 UTC.
    # During US daylight saving time this is 09:25 New York, five minutes before open.
    - cron: "25 13 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker symbol"
        required: false
        default: "QQQ"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Ho_Chi_Minh
      TICKER: ${{ github.event.inputs.ticker || 'QQQ' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-options.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-options.txt

      - name: Build dashboard
        run: python scripts/run_gex_dashboard.py --ticker "$TICKER" --no-open

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p public
          latest_html="$(find data/options -type f -name '*_interactive.html' | sort | tail -n 1)"
          latest_levels="$(find data/options -type f -name '*_levels.txt' | sort | tail -n 1)"
          cp "$latest_html" public/index.html
          cp "$latest_levels" public/levels.txt
          cp -R data public/data

      - name: Upload dashboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TICKER }}-gex-dashboard-${{ github.run_id }}
          path: |
            data/options/**/*.html
            data/options/**/*_levels.txt
            data/options/**/*_summary.json
            data/options/**/*_reconciliation.json
            data/options/**/*.parquet
            data/options/**/replay_index.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
