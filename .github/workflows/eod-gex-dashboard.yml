name: EOD QQQ GEX Dashboard

on:
  schedule:
    # 03:23 Vietnam time (next day) = 20:23 UTC.
    # During US daylight saving time this is 16:23 New York, after the EOD chain settles more.
    - cron: "23 20 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker symbol"
        required: false
        default: "QQQ"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Ho_Chi_Minh
      TICKER: ${{ github.event.inputs.ticker || 'QQQ' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-options.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-options.txt

      - name: Capture QQQ multi-expiry skew
        id: skew_qqq
        continue-on-error: true
        run: python scripts/run_gex_dashboard.py --ticker "$TICKER" --all-expiries --expiry-horizon-days 10 --no-interactive --no-open

      - name: Build QQQ dashboard
        id: build_qqq
        continue-on-error: true
        run: python scripts/run_gex_dashboard.py --ticker "$TICKER" --no-open

      - name: Build NDX dashboard (futures basis vs NQ1!)
        id: build_ndx
        continue-on-error: true
        run: python scripts/run_gex_dashboard.py --ticker NDX --futures-ticker NQ1! --no-interactive --no-open

      - name: Fail run if every ticker failed to build
        if: steps.build_qqq.outcome != 'success' && steps.build_ndx.outcome != 'success'
        run: |
          echo "Both QQQ and NDX dashboard builds failed this run." >&2
          exit 1

      - name: Update QQQ history
        if: steps.build_qqq.outcome == 'success'
        run: python scripts/update_history.py --ticker "$TICKER"

      - name: Update NDX history
        if: steps.build_ndx.outcome == 'success'
        run: python scripts/update_history.py --ticker NDX

      - name: Commit EOD history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in history/snapshots.csv history/latest_summary.json history/latest_summary_NDX.json; do
            [ -f "$f" ] && git add "$f"
          done
          for d in data/options data/market; do
            [ -d "$d" ] && git add "$d"
          done
          git diff --cached --quiet || { git commit -m "Update QQQ/NDX EOD option history"; git push; }

      - name: Prepare GitHub Pages site
        if: steps.build_qqq.outcome == 'success'
        run: |
          mkdir -p public
          latest_html="$(find data/options -type f -name "${TICKER}_*_interactive.html" | sort | tail -n 1)"
          latest_levels="$(find data/options -type f -name "${TICKER}_*_levels.txt" | sort | tail -n 1)"
          latest_summary="$(find data/options -type f -name "${TICKER}_*_summary.json" ! -name "${TICKER}_*_[0-9][0-9][0-9][0-9][0-9][0-9]_summary.json" | sort | tail -n 1)"
          cp "$latest_html" public/index.html
          cp "$latest_levels" public/levels.txt
          cp "$latest_summary" public/latest_summary.json
          mkdir -p public/history
          cp history/snapshots.csv public/history/snapshots.csv
          cp history/latest_summary.json public/history/latest_summary.json

      - name: Upload dashboard artifacts
        if: steps.build_qqq.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TICKER }}-gex-dashboard-eod-${{ github.run_id }}
          path: |
            public/index.html
            public/levels.txt
            public/latest_summary.json
            public/history/snapshots.csv
          if-no-files-found: error
          retention-days: 1

      - name: Configure GitHub Pages
        if: steps.build_qqq.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.build_qqq.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.build_qqq.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
